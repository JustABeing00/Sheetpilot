databases:
  - name: sheetpilot-db
    plan: basic-256mb
    postgresMajorVersion: '16'
    databaseName: sheetpilot

services:
  - type: web
    name: sheetpilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: REPOSITORY_DRIVER
        value: postgres
      - key: DB_AUTO_MIGRATE
        value: 'true'
      - key: STORAGE_LOCAL_DIR
        value: /data/storage
      # Set STORAGE_DRIVER=s3 and fill the S3_* values (Cloudflare R2) to share files with the worker
      # and to scale past one instance; the disk below then becomes optional.
      - key: STORAGE_DRIVER
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sheetpilot-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH_ENABLED
        value: 'false'
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_RESEND_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
    disk:
      name: sheetpilot-data
      mountPath: /data
      sizeGB: 1
