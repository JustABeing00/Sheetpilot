databases:
  - name: sheetpilot-db
    plan: basic-256mb
    postgresMajorVersion: '16'
    databaseName: sheetpilot

services:
  # Disk-only single-service deploy: no R2/S3 at all.
  # The API serves requests AND executes runs in-process.
  # Keep this service at 1 instance (no autoscaling): runs are in-process,
  # so a second instance would mark the first instance's in-flight runs as failed.
  - type: web
    name: sheetpilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: REPOSITORY_DRIVER
        value: postgres
      - key: DB_AUTO_MIGRATE
        value: 'true'
      # Local disk storage only. Files live on the /data disk below.
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: sheetpilot-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      # Set to https://sheetpilot.online in the Render dashboard.
      - key: CORS_ORIGIN
        sync: false
      # Single service = runs execute inside the API process.
      - key: RUN_DISPATCH_IN_PROCESS
        value: 'true'
      - key: RUN_WORKER_POLL_MS
        value: '1000'
      # Auth: pilot default is off so the first deploy succeeds.
      # For full auth, set AUTH_ENABLED=true plus AUTH_URL=https://sheetpilot.online,
      # AUTH_SECRET, and one sign-in method (AUTH_GOOGLE_* or AUTH_RESEND_*).
      - key: AUTH_ENABLED
        value: 'false'
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_RESEND_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
    disk:
      name: sheetpilot-data
      mountPath: /data
      sizeGB: 1
