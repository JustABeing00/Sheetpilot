databases:
  - name: sheetpilot-db
    plan: basic-256mb
    postgresMajorVersion: '16'
    databaseName: sheetpilot

services:
  - type: web
    name: sheetpilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: REPOSITORY_DRIVER
        value: postgres
      - key: DB_AUTO_MIGRATE
        value: 'true'
      - key: STORAGE_LOCAL_DIR
        value: /data/storage
      - key: DATABASE_URL
        fromDatabase:
          name: sheetpilot-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
    disk:
      name: sheetpilot-data
      mountPath: /data
      sizeGB: 1
