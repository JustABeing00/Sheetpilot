services:
  # Fully-free deploy: Render free web + Neon free Postgres, no R2/S3, no disk.
  # The API serves requests AND executes runs in-process.
  # Keep this service at 1 instance (no autoscaling): runs are in-process,
  # so a second instance would mark the first instance's in-flight runs as failed.
  # Free-service limits: sleeps after ~15 min idle (slow first wake), and files on the
  # ephemeral filesystem vanish on sleep/restart — download reports the same day.
  - type: web
    name: sheetpilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 'true'
      - key: REPOSITORY_DRIVER
        value: postgres
      - key: DB_AUTO_MIGRATE
        value: 'true'
      # Ephemeral local storage only (free services have no disks).
      # Files survive while the service stays awake; the database (Neon) is permanent.
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /tmp/storage
      # Neon free Postgres (pooled URL, including ?sslmode=require). Set in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      # Set to https://sheetpilot.online in the Render dashboard.
      - key: CORS_ORIGIN
        sync: false
      # Single service = runs execute inside the API process.
      - key: RUN_DISPATCH_IN_PROCESS
        value: 'true'
      - key: RUN_WORKER_POLL_MS
        value: '1000'
      # Auth: pilot default is off so the first deploy succeeds.
      # For full auth, set AUTH_ENABLED=true plus AUTH_URL=https://sheetpilot.online,
      # AUTH_SECRET, and one sign-in method (AUTH_GOOGLE_* or AUTH_RESEND_*).
      - key: AUTH_ENABLED
        value: 'false'
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: AUTH_RESEND_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
