services:
  postgres:
    image: postgres:16-alpine
    container_name: sheetpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sheetpilot
      POSTGRES_PASSWORD: sheetpilot
      POSTGRES_DB: sheetpilot
    ports:
      - '5432:5432'
    volumes:
      - sheetpilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sheetpilot -d sheetpilot']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sheetpilot-pgdata:
